# What this repository publishes. tools/build.py reads this file and results/, and writes dist/.

source  = "weichseltree/atlas-layer"      # owner/repository on GitHub
title   = "Atlas layer template"          # 1 to 80 characters
home    = "https://github.com/weichseltree/atlas-layer"   # optional, https only
licence = "CC0-1.0"                       # required: the licence of the DATA in dist/
cite    = "Synthetic example field from weichseltree/atlas-layer"   # required: who has to be named

[[layer]]
id     = "example"                        # lower case, also the folder name in dist/
title  = "Example field"
icon   = "wave"                           # optional; the page picks a sign of its own set by this name
body   = "earth"                          # which sphere
array  = "results/example/field.npy"      # shape (H, W): row 0 is north, column 0 is at 180 W
extent = "global"                         # the only extent in version 1: lon -180..180, lat 90..-90
unit   = "m"
type   = "uint8"                          # stored as "uint8" (256 steps) or "uint16" (65536 steps)
min    = -1.5                             # optional: left out, min and max are taken from the data
max    = 1.5
nodata = 255                              # optional: needed when the array has NaN; 0 or the type's largest number
levels = [0, 0]                           # level L is 2^(L+1) x 2^L tiles of 256 px; capped at the array's own detail
focus  = [0, 8]                           # optional: lens depths (0 to 30) at which the layer is offered
maps   = ["viridis", "magma"]             # optional: colour maps of the page

[[layer]]
id     = "example-steps"
title  = "Example field in three steps"
body   = "earth"
array  = "results/example/steps.npy"      # shape (T, H, W): T steps along one axis
unit   = "m"
type   = "uint16"
levels = [0, 0]
axis   = { id = "t", kind = "ordered", unit = "yr", values = ["2000", "2010", "2020"] }   # one value per step
